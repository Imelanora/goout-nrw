[build-system]
requires      = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
 
[project]
name            = "goout-nrw"
version         = "0.1.0"
description     = "Leisure activity recommender for North Rhine-Westphalia"
requires-python = ">=3.9"
dependencies    = [
    "pandas>=1.3",
    "numpy>=1.21",
]
 
[project.scripts]
goout = "goout.__main__:main"
 
[tool.setuptools.packages.find]
where = ["src"]
 